<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مدبّر | إدارة أموالك بذكاء</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="logo">
          <div class="logo-icon">
            <img src="assets/icons/coins-solid-full.png" alt="" />
          </div>
          <div>
            <h1>مدبّر</h1>
            <p>إدارة أموالك بذكاء</p>
          </div>
        </div>

        <nav class="nav">
          <a href="#" class="nav-link active">
            <img src="assets/icons/house-solid-full.png" alt="" />
            <span>الصفحة الرئيسية</span>
          </a>
          <a href="#" class="nav-link">
            <img
              src="assets/icons/arrow-right-arrow-left-solid-full.png"
              alt=""
            />
            <span>المعاملات</span>
          </a>
          <a href="#" class="nav-link">
            <img src="assets/icons/chart-pie-solid-full.png" alt="" />
            <span>الميزانيات</span>
          </a>
          <a href="#" class="nav-link">
            <img src="assets/icons/piggy-bank-solid.png" alt="" />
            <span>المدخرات</span>
          </a>
          <a href="#" class="nav-link">
            <img src="assets/icons/file-invoice-dollar-solid-full.png" alt="" />
            <span>الفواتير الشهرية</span>
          </a>
        </nav>
        <section class="quick">
          <h2>إجراءات سريعة</h2>

          <a href="#" class="action">
            <span class="action-icon blue"
              ><img src="assets/icons/paper-plane-solid-full.png" alt=""
            /></span>
            <span>إرسال أموال</span>
          </a>
          <a href="#" class="action">
            <span class="action-icon green"
              ><img src="assets/icons/plus-solid-full.png" alt=""
            /></span>
            <span>إضافة أموال</span>
          </a>
          <a href="#" class="action">
            <span class="action-icon purple"
              ><img src="assets/icons/receipt-solid-full.png" alt=""
            /></span>
            <span>دفع فاتورة</span>
          </a>
          <a href="#" class="action">
            <span class="action-icon orange"
              ><img src="assets/icons/chart-line-solid-full.png" alt=""
            /></span>
            <span>استثمار</span>
          </a>
        </section>
      </aside>
      <main class="main">
        <main class="main">
          <header class="header">
            <div class="logo">
              <div class="logo-icon">
                <img src="assets/icons/coins-solid-full.png" alt="" />
              </div>
              <div>
                <h1>مدبّر</h1>
                <p>إدارة أموالك بذكاء</p>
              </div>
              <span class="status">متصل</span>
            </div>

            <div class="header-actions">
              <button class="icon-btn">
                <img src="assets/icons/magnifying-glass-solid-full.png" alt="بحث" />
              </button>
              <button class="icon-btn">
                <img src="assets/icons/bell-regular-full.png" alt="الإشعارات" />
                <span class="badge">2</span>
              </button>
              <div class="user">
                <img src="assets/avatar-1.jpg" alt="" class="avatar" />
                <div>
                  <h3>سيف أسامة</h3>
                  <p>حساب مميز</p>
                </div>
              </div>
            </div>
          </header>
        </main>
      </main>
    </div>
  </body>
</html>
